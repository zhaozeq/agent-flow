name: e2e-runbooks
version: 1
description: >-
  能力级端到端测试套件。每个能力获得一个不可变 spec 加一个不可变
  tasks-template；每次执行生成一条带勾选断言、tokens 和实际耗时的
  带时间戳的运行记录。仅行为断言：HTTP 状态、响应内容、持久化状态。
  永远不要记录日志子串。

# Lifecycle note: OpenSpec 在变更目录内起草每个 artifact
# (openspec/changes/<change-id>/)。对于此 schema，四个 artifact 中的三个
# 在变更树之外也有永久位置：
#
#   - test-spec.md      ──►  e2e/testing/{N}-{capability}-test.md
#   - tasks-template.md ──►  e2e/testing/templates/{N}-{capability}-tasks.template.md
#   - run.md            ──►  e2e/testing/runs/{utc-timestamp}_{N}-{capability}-tasks.md
#
# OpenSpec 的 archive 命令仅自动提升 openspec/specs/ 中的内容，因此
# 下面的每个 instruction 都告诉 agent 在两个位置都写文件：
# 变更目录副本是 proposal 的审计跟踪；e2e/testing/ 副本是未来运行消耗的工作测试资产。

artifacts:
  - id: proposal
    generates: proposal.md
    description: >-
      提出一个新的能力测试。命名要断言的行为、设置成本类别、所需 fixtures、
      API 客户端调用以及所选的 N 前缀。在项目中的首次调用时也会搭建 e2e/
      目录树。
    template: proposal.md
    instruction: |
      将 proposal 写入当前变更目录中的 `proposal.md`（OpenSpec 为你解析绝对路径）。

      在填写 proposal 之前，检查消费者项目的 e2e/ 目录是否已搭建。
      如果 `e2e/README.md` 不存在，请先运行搭建步骤（当文件已存在时静默跳过；
      搭建是幂等的，仅一次）：

        1. 创建目录：`e2e/`、`e2e/fixtures/`、`e2e/testing/`、
           `e2e/testing/templates/`、`e2e/testing/runs/`。
        2. 将 `templates/scaffold/e2e-readme.md` 复制到 `e2e/README.md`。
        3. 将 `templates/scaffold/fixtures-readme.md` 复制到
           `e2e/fixtures/README.md`。
        4. 将 `templates/scaffold/testing-readme.md` 复制到
           `e2e/testing/README.md`。
        5. 将 `templates/scaffold/templates-readme.md` 复制到
           `e2e/testing/templates/README.md`。
        6. 将 `templates/scaffold/runs-readme.md` 复制到
           `e2e/testing/runs/README.md`。
        7. 将 `templates/scaffold/gitignore-snippet.txt` 的内容
           追加到消费者项目的根 `.gitignore`（如缺失则创建）。
           该片段必须忽略 `e2e/testing/runs/*.md` 但保留
           `e2e/testing/runs/README.md` 被跟踪，因此使用取反模式。
        8. 暂存所有搭建的文件和 .gitignore 更改，以便用户审查。

      然后填写 proposal。仅行为断言：HTTP 状态码、响应体内容、后台服务中的持久化状态。
      永远不要对日志子串进行断言；日志会跨版本变化。设置成本类别决定 spec 文件名中的 {N} 前缀以及
      扫描中的执行顺序。N 越小 = 设置成本越低 = 越先运行。
      伴随技能在 `.agents/skills/e2e-runbooks/SKILL.md`（由 Lukk17/agent-standards 提供）
      完整解释了方法论。

      Proposal 必须声明一个 Concurrency 配置文件，包含三个字段：

        - Mutates：本测试写入、删除或使其失效的资源。
          命名存储和 collection / table / bucket；当测试仅触及一个时添加分区
          （user id、tenant id）。只读探测不计入——写 `none`。
        - Conflicts with：即使 Mutates 列表不重叠也无法与之并行运行的其他测试。
          典型条目："任何重启栈的测试"、"任何与许可证服务器通信的测试"。
          如果唯一冲突明显来自 Mutates 重叠，则留空。
        - Serial：字面量 `true` 或 `false`。`true` 意味着此测试必须单独运行——
          模式迁移、全栈重启、任何触及全局配置的内容。默认 `false`。

      驱动扫描的主 agent 在生成运行器之前从每个 spec 读取这三个字段。
      Mutates 列表不重叠的两个 spec 可以同时运行；重叠的 spec 必须一个接一个运行；
      `Serial: true` 的 spec 等待正在运行的运行器完成，然后单独运行。
      在生成之前，主 agent 询问用户希望并行运行多少个运行器（没有预设上限——
      用户根据测试环境选择）。当不确定在 Mutates 中放什么时，宁可多声明：
      多出的条目只会多花几分钟的额外序列化时间，缺失的条目会导致运行损坏并强制重新执行。

      e2e-runner 子 agent 在 agent-standards 中可用，路径为
      `.claude/agents/e2e-runner.md` 和 `.opencode/agents/e2e-runner.md`。
      用它作为扫描委托；它拥有运行器契约以及对 `e2e/testing/runs/` 的双重写入。

      Proposal 本身保留在变更目录内；不需要 e2e/ 镜像。
    requires: []

  - id: test-spec
    generates: test-spec.md
    description: >-
      一个能力测试的不可变 spec。七个固定章节：What this verifies、
      Prerequisites、Reset state、Run、Expected、Fixtures、Concurrency。
    template: test-spec.md
    instruction: |
      从 proposal 生成不可变 spec。按以下顺序的七个固定章节：What this verifies、
      Prerequisites、Reset state、Run、Expected、Fixtures、Concurrency。
      每个先决条件检查都是它自己的围栏代码块，前面有散文说明成功标准。
      每个 Reset 命令都是它自己的围栏代码块，按执行顺序排列。
      每个 Run 步骤是一次 API 客户端调用；多步骤测试指示运行器
      在下一步之前等待成功响应。Expected 断言仅是可观察行为。

      在两个位置写入相同内容的文件：

        1. 当前变更目录中的 `test-spec.md`（OpenSpec 解析绝对路径）。
        2. 消费者项目根目录下的 `e2e/testing/{N}-{capability}-test.md`，
           用来自 proposal 的 {N} 和 {capability} 替换。

      变更目录副本是 proposal 的审计跟踪。e2e/testing/ 副本是未来运行消耗的工作资产。

      原样包含来自 proposal 的 Concurrency 章节，以便 spec 携带编排者在扫描时所需的调度元数据。
    requires: [proposal]

  - id: tasks-template
    generates: tasks-template.md
    description: >-
      与 spec 镜像的不可变清单模板，在每次执行时复制。
      包含 Result 摘要字段和一个 Additional tasks I did 章节。
    template: tasks-template.md
    instruction: |
      通过将 spec 中的每个 Prerequisites、Reset、Run 和 Expected 项镜像为复选框来生成 tasks-template。
      附加一个 Verdict 复选框、一个带 Input tokens、Output tokens、Start (UTC)、End (UTC)、Duration 字段的
      Result 摘要块，以及一个用于 spec 外运行器操作的 Additional tasks I did 章节。

      在两个位置写入相同内容的文件：

        1. 当前变更目录中的 `tasks-template.md`。
        2. 消费者项目根目录下的 `e2e/testing/templates/{N}-{capability}-tasks.template.md`，
           用与 spec 匹配的 {N} 和 {capability} 替换。
           `templates/` 子目录仅保存这些运行记录模板；
           `{N}-{capability}-test.md` spec 直接保留在 `e2e/testing/` 下。
    requires: [test-spec]

  - id: run
    generates: run.md
    description: >-
      已填好的执行记录。通过复制 tasks-template 并填入实际结果、勾选、tokens 和持续时间来创建。
    template: run.md
    instruction: |
      run artifact 就是执行本身。通过 proposal 中命名的 API 客户端驱动测试针对实时栈运行，
      边走边勾选框，记录结果。

      文件处理：

        1. 将 tasks-template 内容复制到当前变更目录中的 `run.md`。
           这是 OpenSpec 跟踪的 artifact。当在扫描中重新运行现有测试（没有新变更）时，
           模板源是 `e2e/testing/templates/{N}-{capability}-tasks.template.md`。
        2. 权威的带时间戳的记录保存在消费者项目根目录的
           `e2e/testing/runs/<UTC-timestamp>_{N}-{capability}-tasks.md`。
           UTC 时间戳使用 ISO-8601，冒号替换为连字符（`2026-05-12T17-23-36`），
           以使文件名对文件系统安全。在那里写入相同的已填内容。
           两个文件最终内容相同；变更目录副本是 proposal 记录，
           runs/ 副本是测试执行日志。

      运行器契约：

        1. 将 `Start (UTC)` 记录为第一个动作，在先决条件检查之前。
        2. 按 spec 顺序执行每个任务。成功时勾选框；失败时记录出了什么问题。
        3. 在 Verdict 行确定之后，记录 `End (UTC)`。
        4. 计算 Duration = End - Start，格式为 HH:MM:SS。
           是整个测试的实际耗时（先决条件 + reset + run + verify），
           而不仅仅是 API 客户端调用。
        5. 用最佳的 LLM token 估算填写 Input / Output tokens。
           如果无法获得确切数字则留空。不要凭空捏造。
        6. 编写 Result 摘要段落和 Verdict（PASS 或 FAIL）。
        7. 在"Additional tasks I did"下记录在 spec 之外所做的任何事情。

      e2e-runner 子 agent 在 agent-standards 中可用，路径为
      `.claude/agents/e2e-runner.md` 和 `.opencode/agents/e2e-runner.md`。
      用它作为扫描委托；它拥有运行器契约以及对 `e2e/testing/runs/` 的双重写入。
    requires: [tasks-template]

apply:
  requires: [run]
  tracks: run.md
  instruction: |
    能力测试的 apply 阶段就是运行记录。
    run artifact 是可执行 artifact；没有单独的 apply 步骤。
    将任何 `/opsx:apply` 调用视为"执行下一个待定运行"。