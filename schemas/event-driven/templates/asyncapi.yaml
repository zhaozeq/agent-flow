# 从 event-storming、event-modeling、specs 和 design artifact 编写此 AsyncAPI 文档。
#
# 验证门禁：
#   asyncapi-cli validate asyncapi.yaml
# 在验证成功之前不要将 asyncapi artifact 标记为完成。

asyncapi: 3.0.0
info:
  title: <service-or-domain-name>
  version: 0.1.0
  description: |
    从事件发现和设计决策派生的 AsyncAPI 契约。

defaultContentType: application/json

servers:
  production:
    host: <broker-host>
    protocol: <kafka|nats|amqp|mqtt|ws>
    description: 主要事件 broker

channels:
  <domain.event.v1>:
    address: <domain.event.v1>
    messages:
      <MessageName>:
        $ref: '#/components/messages/<MessageName>'

operations:
  <publishMessageName>:
    action: send
    channel:
      $ref: '#/channels/<domain.event.v1>'
    messages:
      - $ref: '#/channels/<domain.event.v1>/messages/<MessageName>'

components:
  messages:
    <MessageName>:
      name: <MessageName>
      title: <human-readable-title>
      summary: <此消息代表什么>
      payload:
        $ref: '#/components/schemas/<PayloadName>'

  schemas:
    <PayloadName>:
      type: object
      required: []
      properties: {}

  securitySchemes:
    <schemeName>:
      type: <userPassword|apiKey|X509|symmetricEncryption|asymmetricEncryption|httpApiKey|http|oauth2|openIdConnect>