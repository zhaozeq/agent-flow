version: 1

rules:
  selection: stricter-of-complexity-and-risk
  on_doubt: escalate
  revision: record-and-reselect

tiers:
  P0:
    label: 高风险
    schema: evidence-driven
    criteria:
      - 安全、认证、授权、资金、敏感数据或数据删除的行为变化
      - 破坏性公开契约变更（BREAKING）
      - 不可逆的数据迁移，或故障可能造成重大损失且恢复能力不确定
    flow: [proposal, specs, design, review, test-plan, tasks, verify]
    review_mode: fresh-context
    review_timing: once
    design_depth: full
    tdd: mandatory
    coverage: ledger
    adr: when-long-lived
    verify_depth: full

  P1:
    label: 复杂需求
    schema: evidence-driven-p1
    criteria:
      - 跨多个模块/服务协作，或存在显著方案取舍、验证难点
      - 公开 API 的非破坏性行为变化、核心路径修改或性能敏感区改动
      - 引入具有重要集成、运维或数据边界影响的新外部依赖
      - 需求存在影响实现的不确定性，需要独立挑战方案，且不触及 P0 判据
    flow: [proposal, specs, design, review, tasks]
    review_mode: fresh-context
    review_timing: once
    design_depth: full
    tdd: optional
    coverage: inline
    adr: when-long-lived
    verify_depth: none

  P2:
    label: 常规需求
    schema: evidence-driven-p2
    criteria:
      - 有行为变化，但边界清晰、方案成熟、可测试，且不触及 P0/P1 判据
    flow: [proposal, specs, design, tasks]
    review_mode: none
    review_timing: none
    design_depth: brief
    tdd: optional
    coverage: acceptance
    adr: when-long-lived
    verify_depth: none

  P3:
    label: 琐碎修改
    schema: null
    criteria:
      - 文案、注释或纯展示样式调整，不改变行为契约或交互语义
      - 不改变行为且无安全、部署或数据影响的配置微调
    flow: []
    review_mode: none
    review_timing: none
    design_depth: skip
    tdd: none
    coverage: none
    adr: none
    verify_depth: none
